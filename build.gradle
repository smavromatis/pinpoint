plugins {
    id 'java'
}

group = 'com.pinpoint'
version = '2.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    // Compile against the Java 17 API (as CI and Burp's minimum do), even when building on a newer JDK
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime: compile against it, but don't bundle it into the jar
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Pinpoint', 'Implementation-Version': project.version
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
